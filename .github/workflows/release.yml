name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Linux x64 artifact
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="tvmod-${VERSION}-linux-x64"
          mkdir -p "release/${NAME}"
          cp -r dist bin docs README.md LICENSE SECURITY.md package.json "release/${NAME}/"
          tar -czf "release/${NAME}.tar.gz" -C release "${NAME}"
          sha256sum "release/${NAME}.tar.gz" > release/SHA256SUMS
          cat release/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true
