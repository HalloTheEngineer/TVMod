name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Linux x64 release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:binary
      - run: ./dist/tvmod --version
      - run: npm run package:release
      - run: sha256sum -c SHA256SUMS
        working-directory: release

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(ls release/*.tar.gz)"
          cosign sign-blob --yes --bundle "${TARBALL}.sigstore.json" "${TARBALL}"
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(ls release/*.tar.gz)"
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify-blob --bundle "${TARBALL}.sigstore.json" --certificate-identity "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}" "${TARBALL}"
          cosign verify-blob --bundle release/SHA256SUMS.sigstore.json --certificate-identity "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}" release/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            release/*.sigstore.json
          generate_release_notes: true
